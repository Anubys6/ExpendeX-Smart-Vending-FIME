<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capturas Oficiales Google Pay - ExpendeX Vending</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Estilos específicos para las pantallas de captura oficial de Google Pay */
    body {
      background-color: #f1f5f9;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow-x: hidden;
    }

    .capture-container {
      width: 100%;
      min-height: 100vh;
      position: relative;
    }

    /* Modal abierto estático para capturas */
    .static-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5000;
      padding: 20px;
    }

    .static-modal-card {
      background: #ffffff;
      border-radius: 20px;
      max-width: 440px;
      width: 100%;
      padding: 26px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    /* Google Pay Sheet Dialog (Paso 4) */
    .gpay-native-sheet {
      background: #ffffff;
      border-radius: 24px;
      max-width: 420px;
      width: 95%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      font-family: "Google Sans", Roboto, Arial, sans-serif;
    }

    .gpay-sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px 14px 24px;
      border-bottom: 1px solid #f1f3f4;
    }

    .gpay-header-brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gpay-sheet-body {
      padding: 20px 24px;
    }

    .gpay-merchant-info {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 16px;
    }

    .gpay-merchant-name {
      font-size: 0.95rem;
      color: #5f6368;
      font-weight: 500;
    }

    .gpay-amount {
      font-size: 1.6rem;
      font-weight: 700;
      color: #202124;
    }

    .gpay-product-desc {
      font-size: 0.85rem;
      color: #70757a;
      margin-top: 2px;
    }

    .gpay-card-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8f9fa;
      border: 1.5px solid #dadce0;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .gpay-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .visa-pill {
      background: #1a1f71;
      color: #ffffff;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .gpay-card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #202124;
    }

    .gpay-card-sub {
      font-size: 0.78rem;
      color: #5f6368;
    }

    .gpay-security-note {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #5f6368;
      margin-bottom: 20px;
    }

    .btn-gpay-confirm {
      width: 100%;
      height: 48px;
      background: #1a73e8;
      color: #ffffff;
      border: none;
      border-radius: 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3);
      transition: background 0.2s;
    }

    .btn-gpay-confirm:hover {
      background: #1557b0;
    }

    /* Pantalla posterior a la compra (Paso 5) */
    .post-purchase-card {
      background: #ffffff;
      border-radius: 24px;
      max-width: 450px;
      width: 100%;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
    }

    .success-check-bubble {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #34a853;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 800;
      margin: 0 auto 16px auto;
      box-shadow: 0 8px 20px rgba(52, 168, 83, 0.35);
    }

    .receipt-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px 18px;
      margin: 18px 0;
      text-align: left;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      padding: 6px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .receipt-row:last-child {
      border-bottom: none;
      padding-top: 10px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #059669;
    }
  </style>
</head>
